# =====================================================================
# nattunnel —— 嵌入现有 www.keliit.top vhost 的配置块
# (该域名与其他站点混部: 只往现有配置里加 location, 不要新建 server 块)
#
# 注意: 客户端 exe 的 REST 调用(/me、/tunnels/{tid})会先试 /api 前缀,
#       404 时自动回退到 /nattunnel-admin/api(客户端内置), 无需额外 location。
# 部署步骤概要(详见 docs/deploy-keliit-top.md):
#   1) http { } 上下文中加 map(若配置里已有等价 map 可直接复用其变量名)
#   2) www.keliit.top 的 server { ... } 块内加下面两个 location
#   3) nginx -t && nginx -s reload
# =====================================================================

# ---- 1) http { } 上下文(与 server 块平级) ----
# WS 握手带 Upgrade 头 => Connection: upgrade; 普通 HTTP(浏览器直开短链) => close
map $http_upgrade $nattunnel_conn {
    default upgrade;
    ''      close;
}

# ---- 2a) 隧道公共入口: /tunnel/* 原样直通 FastAPI ----
#   - WebSocket 中继 (客户端 exe / WS 浏览器)
#   - 纯 HTTP 直转短链 (浏览器直接打开 https://www.keliit.top/tunnel/<短链>)
# 注意: proxy_pass 不带 URI 部分 => 请求路径原样转发(FastAPI 侧路由就是 /tunnel/{tid})。
#       请确认该 vhost 现有站点没有占用 /tunnel/ 前缀的路径。
location = /tunnel {        # 不带结尾斜杠时强制补上(保证相对路径解析正确)
    return 301 /tunnel/;
}
location /tunnel/ {
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $nattunnel_conn;
    # 长连接, 空闲超时拉长(按业务调整)
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

# ---- 2b) 网页管理端 + REST API: 剥掉 /nattunnel-admin/ 前缀后转发 FastAPI 根路径 ----
#   https://www.keliit.top/nattunnel-admin/          -> FastAPI /  (登录页+管理面板)
#   https://www.keliit.top/nattunnel-admin/api/me    -> FastAPI /api/me
# 管理页内所有 API 调用均为相对路径, 与本地根路径部署共用同一份代码。
location = /nta {                    # (nta: nattunnel-admin 的缩写)
    return 301 /nattunnel-admin/;
}
location = /nattunnel-admin {        # 不带结尾斜杠时强制补上(保证相对路径解析正确)
    return 301 /nattunnel-admin/;
}
location /nattunnel-admin/ {
    proxy_pass http://127.0.0.1:8000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}
